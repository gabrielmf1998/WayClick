name: build packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  rpm-deb:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: dnf install -y rpm-build binutils tar gzip zstd bsdtar desktop-file-utils python3 findutils
      - run: bash packaging/build-rpm.sh
      - run: bash packaging/build-deb.sh
      - run: bash packaging/build-pacman.sh
      - uses: actions/upload-artifact@v4
        with: { name: distro-packages, path: dist/* }

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y libfuse2 desktop-file-utils
      - run: bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: dist/* }

  publish:
    needs: [rpm-deb, appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
